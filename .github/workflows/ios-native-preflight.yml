name: DocWallet native iOS simulator preflight (unsigned)

on:
  pull_request:
    paths:
      - 'App.*'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/ios-native-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docwallet-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Expo 51 dependencies without changing lockfile
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Generate iOS project
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Compile unsigned iOS simulator build
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -type d | head -1)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/docwallet-derived" build 2>&1 | tee ios-native-build.log
      - name: Install and launch app in iPhone simulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR="$RUNNER_TEMP/docwallet-derived/Build/Products/Debug-iphonesimulator"
          APP_PATH="$(find "$PRODUCT_DIR" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          DEVICE_ID="$(xcrun simctl list devices available -j | node -e 'let x="";process.stdin.on("data",d=>x+=d);process.stdin.on("end",()=>{let devices=Object.values(JSON.parse(x).devices).flat();let d=devices.find(v=>v.isAvailable&&v.name.startsWith("iPhone"));if(!d)process.exit(1);console.log(d.udid)})')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/docwallet-native-ios-launch.png"
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID"
          xcrun simctl shutdown "$DEVICE_ID" || true
      - name: Archive simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-screenshot
          path: ${{ runner.temp }}/docwallet-native-ios-launch.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-ios-native-log
          path: ios-native-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive unsigned app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-ios-simulator-app
          path: ${{ runner.temp }}/docwallet-derived/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
